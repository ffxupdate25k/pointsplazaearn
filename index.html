<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Points Plaza - Register</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
background:linear-gradient(135deg,#EAF7FF,#D7F0FF);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}
.container{width:100%;max-width:390px}
.logo{text-align:center;margin-bottom:20px}
.logo h1{font-size:34px;color:#2196F3}
.logo p{color:#666;margin-top:5px}
.card{
background:#fff;
border-radius:22px;
padding:22px;
box-shadow:0 10px 30px rgba(33,150,243,.15);
}
.card h2{text-align:center;color:#1976D2;margin-bottom:15px}
input{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #D3E9FF;
border-radius:12px;
outline:none;
font-size:15px;
}
input:focus{border-color:#2196F3}
button{
width:100%;
padding:14px;
margin-top:10px;
background:#2196F3;
color:#fff;
border:none;
border-radius:12px;
font-size:16px;
font-weight:bold;
}
.progress{
width:100%;
height:10px;
background:#DCEEFF;
border-radius:20px;
overflow:hidden;
margin:10px 0;
}
#bar{
width:0%;
height:100%;
background:#2196F3;
transition:.3s;
}
.hidden{display:none}
#loadingBox{text-align:center;margin-top:15px}
.login{text-align:center;margin-top:18px}
.login a{color:#2196F3;text-decoration:none;font-weight:bold}
</style>
</head>
<body>

<div class="container">

<div class="logo">
<h1>Points Plaza</h1>
<p>Earn PTS from Tasks & Referrals</p>
</div>

<div class="card">

<h2>Create Account</h2>

<input id="username" placeholder="Username">
<input id="email" type="email" placeholder="Email">
<input id="fullname" placeholder="Full Name">
<input id="password" type="password" placeholder="Password">
<input id="confirm" type="password" placeholder="Confirm Password">

<button id="registerBtn">REGISTER</button>

<div id="loadingBox" class="hidden">
<p>Creating your account...</p>

<div class="progress">
<div id="bar"></div>
</div>

<h3 id="percent">0%</h3>
</div>

<p class="login">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>
</div>

<script>
document.getElementById("registerBtn").onclick=function(){

let username=document.getElementById("username").value.trim();
let email=document.getElementById("email").value.trim();
let fullname=document.getElementById("fullname").value.trim();
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirm").value;

if(!username||!email||!fullname||!password||!confirm){
alert("Please fill all fields");
return;
}

if(password!==confirm){
alert("Passwords do not match");
return;
}

document.getElementById("loadingBox").classList.remove("hidden");

let p=0;
let timer=setInterval(function(){

p+=20;

document.getElementById("bar").style.width=p+"%";
document.getElementById("percent").innerHTML=p+"%";

if(p>=100){

clearInterval(timer);

let user={
username:username,
email:email,
fullname:fullname,
password:password,
taskBalance:0,
referralBalance:0,
completedTasks:0,
referrals:0,
joined:new Date().toLocaleDateString()
};

localStorage.setItem("currentUser",JSON.stringify(user));

window.location.href="dashboard.html";

}

},300);

}
</script>

</body>
</html>
