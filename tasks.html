<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Points Plaza - Tasks</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#EEF7FF;padding-bottom:90px}
.header{background:#2196F3;color:#fff;padding:18px;font-size:22px;font-weight:bold}
.card{background:#fff;margin:15px;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.reward{color:#2196F3;font-weight:bold}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;font-weight:bold;margin-top:10px}
.open{background:#E3F2FD;color:#1976D2}
.submit{background:#2196F3;color:#fff}
input[type=file]{margin-top:10px;width:100%}
.bottom{position:fixed;bottom:0;left:0;right:0;height:74px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.08)}
.nav{text-align:center;font-size:11px;color:#777}
.nav span{font-size:26px}
.active{color:#2196F3}
</style>
</head>
<body>

<div class="header">📋 Available Tasks</div>

<div id="taskList"></div>

<div class="bottom">
<div class="nav" onclick="location.href='dashboard.html'"><span class="material-symbols-rounded">home</span><p>Home</p></div>
<div class="nav active"><span class="material-symbols-rounded">task_alt</span><p>Tasks</p></div>
<div class="nav" onclick="location.href='team.html'"><span class="material-symbols-rounded">groups</span><p>Team</p></div>
<div class="nav" onclick="location.href='withdrawal.html'"><span class="material-symbols-rounded">account_balance</span><p>Withdraw</p></div>
<div class="nav" onclick="location.href='profile.html'"><span class="material-symbols-rounded">person</span><p>Profile</p></div>
</div>

<script>
const tasks=[
{name:"Join Telegram",reward:50,link:"https://t.me/yourchannel",instruction:"Join our Telegram channel."},
{name:"Join WhatsApp",reward:50,link:"https://chat.whatsapp.com/yourlink",instruction:"Join our WhatsApp group."}
];

const list=document.getElementById("taskList");

tasks.forEach((t,i)=>{
list.innerHTML+=`
<div class="card">
<h3>${t.name}</h3>
<p>${t.instruction}</p>
<p class="reward">+${t.reward} PTS</p>

<button class="btn open" onclick="window.open('${t.link}')">
Open Task
</button>

<input type="file" accept="image/*" id="proof${i}">

<button class="btn submit" onclick="submitTask(${i})">
Submit Screenshot
</button>
</div>`;
});

function submitTask(i){
const file=document.getElementById("proof"+i).files[0];
if(!file){
alert("Please upload a screenshot.");
return;
}
alert("Task submitted successfully! Waiting for admin approval.");
}
</script>

</body>
</html>
